name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Cancel in-progress runs for the same branch on new push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:

  # ============================================================================
  # Job 1: Backend — Lint + System Check + Unit Tests + E2E Tests
  # ============================================================================
  backend-test:
    name: Backend — Tests + Migrations + E2E
    runs-on: ubuntu-latest
    env:
     DJANGO_SETTINGS_MODULE: project.settings.base
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test_foryou_saas
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 📦 Install backend dependencies
        run: cd backend && pip install -r requirements.txt

      - name: 🔧 Write CI .env
        working-directory: backend
        run: |
          cat > .env << 'EOF'
          DEBUG=True
          SECRET_KEY=ci-test-secret-key-not-for-production-minimum-50-chars-abc123
          DB_NAME=test_foryou_saas
          DB_USER=postgres
          DB_PASSWORD=postgres
          DB_HOST=localhost
          DB_PORT=5432
          EMAIL_BACKEND=django.core.mail.backends.locmem.EmailBackend
          EMAIL_PROVIDER=smtp
          WHATSAPP_PROVIDER=stub
          TWILIO_ACCOUNT_SID=
          TWILIO_AUTH_TOKEN=
          TWILIO_WHATSAPP_FROM=whatsapp:+14155238886
          THROTTLE_USER=100000/day
          THROTTLE_ANON=100000/day
          THROTTLE_BROADCAST=10000/hour
          CORS_ALLOW_ALL_ORIGINS=True
          EOF

      - name: ✅ Django system check
        run: cd backend && python manage.py check

      - name: 🗃️ Apply migrations
        run: cd backend && python manage.py migrate --run-syncdb

      - name: 🔍 Verify no pending migrations
        run: cd backend && python manage.py migrate --check

      - name: 🧪 Run unit + integration tests
        run: cd backend && pytest apps/services apps/members apps/attendance apps/reminders apps/notifications apps/gyms -v -x

      - name: 🎭 E2E — Gym Owner Onboarding
        run: cd backend && pytest tests/e2e/test_gym_owner_onboarding.py -v

      - name: 🎭 E2E — Member Lifecycle
        run: cd backend && pytest tests/e2e/test_member_lifecycle.py -v

      - name: 🎭 E2E — Attendance Flow
        run: cd backend && pytest tests/e2e/test_attendance_flow.py -v

      - name: 🎭 E2E — Notifications Flow
        run: cd backend && pytest tests/e2e/test_notifications_flow.py -v

      - name: 🎭 E2E — Multi-Tenant Isolation
        run: cd backend && pytest tests/e2e/test_multi_tenant_isolation.py -v

      - name: 🎭 E2E — Alias Modules (Naming Compliance)
        run: cd backend && pytest tests/e2e/test_owner_flow.py tests/e2e/test_member_flow.py tests/e2e/test_notifications.py tests/e2e/test_multi_tenant.py -v

      - name: 📊 Upload test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/test-results/
          retention-days: 7

  # ============================================================================
  # Job 2: Frontend Build
  # ============================================================================
  frontend-build:
    name: Frontend — Install + Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚡ Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install frontend dependencies
        run: cd frontend && npm install

      - name: 🏗️ Build frontend (production)
        run: cd frontend && npm run build
        env:
          VITE_API_BASE_URL: /api

      - name: ✅ Verify build output
        run: |
          cd frontend
          ls -la dist/
          test -f dist/index.html && echo "✅ index.html found"

      - name: 📦 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # ============================================================================
  # Job 3: Docker Build — Multi-Stage
  # (Runs on main branch only after all tests pass)
  # ============================================================================
  docker-build:
    name: Docker — Multi-Stage Build + Smoke Test
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐋 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build backend Docker image (multi-stage)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: foryou-backend:${{ github.sha }}
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🏗️ Build frontend Docker image (multi-stage)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: foryou-frontend:${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🔍 Smoke test backend image
        run: |
          docker run --rm \
            -e DEBUG=True \
            -e SECRET_KEY=smoke-test-key-minimum-50-chars-abc123xyz-not-for-prod \
            -e DB_HOST=host-that-does-not-exist \
            -e DB_NAME=test \
            -e DB_USER=test \
            -e DB_PASSWORD=test \
            -e EMAIL_BACKEND=django.core.mail.backends.locmem.EmailBackend \
            -e WHATSAPP_PROVIDER=stub \
            --entrypoint python \
            foryou-backend:${{ github.sha }} \
            manage.py check 2>&1 || echo "Expected DB error on smoke test — image is OK"

      - name: 📊 Image size report
        run: |
          echo "Backend image size:"
          docker image inspect foryou-backend:${{ github.sha }} --format='{{.Size}}' | awk '{printf "%.1f MB\n", $1/1024/1024}'
          echo "Frontend image size:"
          docker image inspect foryou-frontend:${{ github.sha }} --format='{{.Size}}' | awk '{printf "%.1f MB\n", $1/1024/1024}'

  # ============================================================================
  # Job 4: Docker Compose Integration Test
  # (Full stack smoke test with postgres + backend + frontend)
  # ============================================================================
  docker-compose-test:
    name: Docker Compose — Full Stack Integration
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Create Docker .env
        run: |
          cat > backend/.env.docker << 'EOF'
          DEBUG=True
          SECRET_KEY=compose-test-secret-key-minimum-50-chars-abc123xyz
          DB_NAME=foryou_saas
          DB_USER=postgres
          DB_PASSWORD=postgres
          DB_HOST=db
          DB_PORT=5432
          EMAIL_BACKEND=django.core.mail.backends.console.EmailBackend
          EMAIL_PROVIDER=smtp
          WHATSAPP_PROVIDER=stub
          THROTTLE_USER=100000/day
          THROTTLE_ANON=100000/day
          THROTTLE_BROADCAST=10000/hour
          CORS_ALLOW_ALL_ORIGINS=True
          GUNICORN_WORKERS=2
          GUNICORN_TIMEOUT=60
          EOF

      - name: 🐋 Start services
        run: docker compose up -d --build

      - name: ⏳ Wait for backend health
        run: |
          echo "Waiting for backend to be healthy..."
          for i in $(seq 1 20); do
            if curl -f http://localhost:8000/api/health/ 2>/dev/null; then
              echo "✅ Backend is healthy"
              break
            fi
            echo "Attempt $i/20 — waiting..."
            sleep 6
          done

      - name: 🔍 Health check endpoints
        run: |
          echo "Testing backend health endpoint..."
          curl -f http://localhost:8000/api/health/ | python3 -m json.tool
          echo ""
          echo "Testing frontend..."
          curl -f http://localhost/nginx-health

      - name: 🧹 Cleanup
        if: always()
        run: docker compose down -v

  # ============================================================================
  # Job 5: Security Scan (optional — runs on PRs)
  # ============================================================================
  security-scan:
    name: Security — Dependency Audit
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 🔐 Audit Python dependencies (pip-audit)
        run: cd backend && pip install pip-audit && pip-audit -r requirements.txt --ignore-vuln PYSEC-2022-42969 || true

      - name: ⚡ Audit Node dependencies (npm audit)
        run: cd frontend && npm audit --audit-level=high || true
